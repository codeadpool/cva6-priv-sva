name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde # v3.1.0
        with:
          version: '2026-04-07'
      - run: make versions
      # Sail slice must still be upstream's code, re-derived not hand-edited
      - run: make sail-provenance
      # exception: Sail miter wrapper, where the assumes are the stated
      # equivalence domain. Three (reserved==0, mode!=NA4, !(W&&!R)) are CSR
      # invariants proven separately in csr_warl; two restrict the access to
      # aligned and non-wrapping. any assume elsewhere still fails the build
      - name: no assumes (soundness gate)
        run: |
          if grep -rnw assume fv/ --exclude=pmp_sail_ref_fv.sv; then
            echo "unexpected assume in fv/ (free inputs only)"; exit 1; fi
          echo "no assumes in fv/ outside the Sail miter domain"
      # The twelve expected-CEX probes fail bmc by design, so keep going and gate on
      # the explicit verdict check below rather than the aggregate exit code
      - run: make -k verify-all || true
      - run: make results || true
      - name: assert expected verdicts
        run: |
          set -e
          pass() { test -f "results/$1/PASS" || { echo "MISSING PASS: $1"; exit 1; }; }
          fail() { test -f "results/$1/FAIL" || { echo "PROBE NOT FAILING: $1"; exit 1; }; }
          # proven checks: every task passes bmc/prove/cover
          for t in bmc prove cover; do
            pass "pmp/pmp_entry_$t"
            pass "pmp/pmp_match_$t"
            pass "pmp/pmp_ref_$t"
            pass "csr/csr_warl_$t"
            pass "trap/trap_priv_$t"
            pass "vm/vm_$t"
          done
          # expected-CEX probes (the findings): bmc fails, cover reaches
          for p in mstatus/mstatus_f5 mstatus/mstatus_mprv \
                   probe/probe_pmp_mpri probe/probe_priv_dret \
                   probe/probe_dcsr_reserved probe/probe_priv_dret_rvh \
                   probe/probe_mpp_legal probe/probe_mpp_legal_rvh \
                   probe/probe_dcsr_vlegal_rvh probe/probe_ptw_pte \
                   probe/probe_ptw_req probe/probe_pmp_entry_arch; do
            fail "${p}_bmc"
            pass "${p}_cover"
          done
          # probes carrying a prove task must also fail it on golden: an
          # unbounded proof here would mean the defect is gone from v5.3.0
          for p in mstatus/mstatus_f5 probe/probe_priv_dret probe/probe_priv_dret_rvh \
                   probe/probe_dcsr_reserved \
                   probe/probe_mpp_legal probe/probe_mpp_legal_rvh \
                   probe/probe_dcsr_vlegal_rvh probe/probe_ptw_pte \
                   probe/probe_ptw_req probe/probe_pmp_entry_arch; do
            fail "${p}_prove"
          done
          # Sail miter, three columns (evidence/sail/): golden (c1) fails a_amatch_arch;
          # with #3490 (c2) every property proves; with #3177 also fixed (c3)
          # a_full_equiv proves, so the M-divergence cover is the only miss
          fail "sail/sail_pmp_bmc"
          fail "sail/sail_pmp_prove"
          pass "sail/sail_pmp_cover"
          for t in bmc prove cover; do pass "sail/sail_pmp_tor_$t"; done
          pass "sail/sail_pmp_full_bmc"
          pass "sail/sail_pmp_full_prove"
          fail "sail/sail_pmp_full_cover"
          log=results/sail/sail_pmp_full_cover/logfile.txt
          test "$(grep -c 'Unreached cover statement' "$log")" = 1
          grep -q 'Unreached cover statement at .*c_m_divergence' "$log"
          for d in sail_pmp sail_pmp_tor sail_pmp_full; do
            test "$(grep -c yosys-smt2-register "results/sail/${d}_prove/model/design_smt2.smt2")" = 0
          done
          echo "all verdicts as expected"

  # the committed Sail SV must regenerate byte-for-byte from the slice with the
  # digest-pinned official compiler, via the documented container.
  sail-regen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -f fv/sail/Containerfile.sail -t cva6-sail fv/sail
      - run: docker run --rm -v "$PWD":/workspace:ro -w /tmp cva6-sail bash /workspace/fv/sail/regen.sh --verify

  # The 2x2s: our proven properties on corrected CVA6,
  # Verdicts must invert. Failure means the experiment no longer reproduces.
  # See evidence/2x2/README.md.
  verdict-inversion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde # v3.1.0
        with:
          version: '2026-04-07'
      - name: "TOR grain bit (#3342), incomplete own-bound fix: both oracles must break"
        run: |
          set -e
          git -C cva6 apply ../evidence/2x2/pmp_tor_grain.patch
          cd fv/checks
          sby -f -d ../../results/inv/pmp_entry_masked_bmc pmp_entry.sby            bmc || true
          sby -f -d ../../results/inv/arch_masked_bmc      probe_pmp_entry_arch.sby bmc || true
          cd ../..
          test -f results/inv/pmp_entry_masked_bmc/FAIL || { echo "PMP-5 did NOT break on the partly-corrected matcher"; exit 1; }
          test -f results/inv/arch_masked_bmc/FAIL      || { echo "PMP-10 did NOT break on the INCOMPLETE fix"; exit 1; }
          grep -q 'failed assertion.*a_tor_exact at'      results/inv/pmp_entry_masked_bmc/logfile.txt
          grep -q 'failed assertion.*a_tor_exact_arch at' results/inv/arch_masked_bmc/logfile.txt
          git -C cva6 checkout core/pmp/src/pmp_entry.sv
          echo "partial fix rejected by both oracles, as expected"
      - name: "M-mode priority (#3177): PMP-4 must break, PMP-9 must hold"
        run: |
          set -e
          git -C cva6 apply ../evidence/2x2/pmp_3177_priority.patch
          cd fv/checks
          sby -f -d ../../results/inv/pmp_ref_fixed_bmc   pmp_ref.sby        bmc || true
          sby -f -d ../../results/inv/pmp_mpri_fixed_bmc  probe_pmp_mpri.sby bmc || true
          cd ../..
          test -f results/inv/pmp_ref_fixed_bmc/FAIL  || { echo "PMP-4 did NOT break on the corrected arbiter"; exit 1; }
          test -f results/inv/pmp_mpri_fixed_bmc/PASS || { echo "PMP-9 did NOT hold on the corrected arbiter"; exit 1; }
          grep -q 'failed assertion.*a_m_impl_equiv' results/inv/pmp_ref_fixed_bmc/logfile.txt
          git -C cva6 checkout core/pmp/src/pmp.sv
          echo "priority-order inversion reproduced"
      - name: "upstream PR (#3490): PMP-5 must break, PMP-10 must hold"
        run: |
          set -e
          git -C cva6 apply ../evidence/2x2/pmp_tor_grain_both_pr3490.patch
          cd fv/checks
          sby -f -d ../../results/inv/pmp5_on_3490_bmc  pmp_entry.sby            bmc   || true
          sby -f -d ../../results/inv/arch_on_3490_prove probe_pmp_entry_arch.sby prove || true
          cd ../..
          test -f results/inv/pmp5_on_3490_bmc/FAIL   || { echo "PMP-5 did NOT break on PR #3490"; exit 1; }
          test -f results/inv/arch_on_3490_prove/PASS || { echo "PMP-10 did NOT hold on PR #3490"; exit 1; }
          grep -q 'failed assertion.*a_tor_exact at' results/inv/pmp5_on_3490_bmc/logfile.txt
          git -C cva6 checkout core/pmp/src/pmp_entry.sv
          echo "transcribed oracle rejects the correct fix; spec-derived oracle accepts it"
      - name: submodule restored
        run: |
          git -C cva6 diff --quiet || { echo "cva6 submodule left dirty"; exit 1; }
          echo "cva6 clean"

  # Mutation testing (~26 rebuilds), on demand only
  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: YosysHQ/setup-oss-cad-suite@aefa8397bbf8fc6670a0a62af9805a89738f3cde # v3.1.0
        with:
          version: '2026-04-07'
      - run: bash fv/validation/mutation_test.sh
